# KauKauBot Terran openings, run by the ares BuildOrderRunner.
#
# Ares looks for `<race>_builds.yml` in the repo root, lowercase, and reads
# whichever one matches `MyBotRace` in config.yml. Terran is currently a
# local experiment: `MyBotRace` has to be `Terran` for anything in this file
# to run at all, and it must go back to `Zerg` before a Zerg ladder zip.
#
# Forcing an opening locally: set `Debug: True` in config.yml (ares then uses
# the `test_123` opponent id) and put the opening you want first in the
# `test_123` cycle below. Reordering alone is not enough if that opponent id
# already has a winning history — clear `data/test_123-<race>.json` too.
# See ARCHITECTURE.md gotcha 4.

# Save game opening + result to ./data so ares can switch openings after a loss.
UseData: True
# Cycle: keep the opening while it wins, advance to the next one after a defeat.
BuildSelection: Cycle
MinGamesWinrateBased: 5

BuildChoices:
    # Active when `Debug: True` in config.yml.
    test_123:
        BotName: LocalDebug
        Cycle:
            - Four Rax Proxy

    # One Terran build exists, so every cycle names it. These are here so
    # that flipping `Debug` to False does not leave ares with an opponent
    # race it has no cycle for.
    Terran:
        BotName: TerranRace
        Cycle:
            - Four Rax Proxy

    Protoss:
        BotName: ProtossRace
        Cycle:
            - Four Rax Proxy

    Zerg:
        BotName: ZergRace
        Cycle:
            - Four Rax Proxy

    Random:
        BotName: RandomRace
        Cycle:
            - Four Rax Proxy

Builds:
    # Four Rax Proxy: every structure this build places — both Depots, all
    # four Barracks — is placed by one of three hand-walked SCVs (X, Y, Z)
    # that never gather, NOT by this opening. See `PROXY_CREW` in
    # bot/builds/terran/four_rax_proxy.py for the actual task lists and
    # bot/steps/terran.py's `proxy_crew()` for the mechanism.
    #
    # That is deliberate, and this list must stay this way: adding a
    # `supplydepot`/`barracks` line here would have ares' own generic
    # `BuildStructure`/`select_worker` build a *second* one of that structure
    # with a worker pulled fresh off the minerals, alongside whichever of
    # X/Y/Z is already building the "real" one.
    #
    # So this opening only has to cover what's actually a supply-count
    # trigger: `ConstantWorkerProductionTill` keeps SCVs flowing up to the
    # build's own hard cap of 14 total (the starting 12 plus exactly two
    # more — the build order's two "SCV" steps, the first of which the
    # `on_unit_created` hook claims as Z the instant it spawns, see
    # `claim_z_on_first_scv`; see `WORKER_TARGET` in
    # bot/builds/terran/four_rax_proxy.py for the same number enforced past
    # the opening). This is an all-in, not an economy build — nothing here
    # trains a 15th SCV. The single `scv` line below is enough to let ares
    # consider this opening complete almost immediately, handing off to
    # `macro_steps` (Marines, the one remaining SCV) well before Barracks A
    # is anywhere close to done.
    #
    # No `AutoSupplyAtSupply` here (was 15; removed). It's ares' own
    # build-runner-level generic supply mechanism, separate from anything in
    # `macro_steps` — and PROXY_CREW already places exactly two Depots by
    # design, at exactly the points the nine-step build order names. Leaving
    # this set collided with that: `AutoSupplyAtSupply` and `c.auto_supply()`
    # (also removed, from bot/builds/terran/four_rax_proxy.py's macro_steps —
    # see its comment there) are two separate ares mechanisms that each pull
    # a worker to build a Depot on their own supply-based trigger, neither
    # aware the crew already has it covered. The "SCV ahead of Z" bug
    # reported after the first real game was one of them firing before Z had
    # even spawned to build its own Depot. Omitting the key leaves it at
    # ares' own default (200), which this build's supply values never near.
    Four Rax Proxy:
        ConstantWorkerProductionTill: 14
        OpeningBuildOrder:
            - 12 scv
