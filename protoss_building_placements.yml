# KauKauBot Protoss custom placements (overrides/merges ares defaults).
# Nat wall under VsAll so VsTerran (ares: reaper-only) still gets 3x3 wall slots.
# Coords from ares VsZerg nat walls; PylonsWall renamed to Pylons (ares applies that key).
# Order matters: ThreeByThreesWall before Pylons so wall 3x3s win avoid-grid
# conflicts (Persephone Lower: production pylon sat on a wall slot).
# ThreeByThreesWall + GateKeeper leave a unit-width exit — fill with 2 Gate + Robo only;
# do not place a fourth structure on the GateKeeper gap.
# MapPool: Incorporeal, LeyLines, Magannatha, Persephone, Pylon, Torches, Ultralove.

Incorporeal:
  UpperSpawn:
    VsAll:
      FirstPylon:
        # natural wall
        - [ [ 62.0, 134.0 ] ]
      ThreeByThreesWall:
        # natural wall
        - [ [ 62.5, 128.5 ], [ 59.5, 129.5 ], [ 66.5, 129.5 ] ]
      GateKeeper:
        # natural wall
        - [ [ 64.5, 128.5 ] ]
      Pylons:
        # natural wall
        - [ [ 62.0, 131.0 ] ]
  LowerSpawn:
    VsAll:
      FirstPylon:
        # natural wall
        - [ [ 94.0, 31.0 ] ]
      ThreeByThreesWall:
        # natural wall
