# KauKauBot Zerg openings, run by the ares BuildOrderRunner - except Macro
# Zerg, this file's only build, which deliberately runs an empty
# OpeningBuildOrder and owns all of its own timings in Python instead (see
# `Builds:` below and `bot/builds/zerg/macro_zerg.py`).
#
# Forcing an opening locally: set `Debug: True` in config.yml (ares then uses
# the `test_123` opponent id) and put the opening you want first in the
# `test_123` cycle below. This replaces the old `FORCE_BUILD` in config.py.

# Save game opening + result to ./data so ares can switch openings after a loss.
UseData: True
# Cycle: keep the opening while it wins, advance to the next one after a defeat.
BuildSelection: Cycle
MinGamesWinrateBased: 5

BuildChoices:
    # Active when `Debug: True` in config.yml — reorder to force an opening.
    test_123:
        BotName: LocalDebug
        Cycle:
            - Macro Zerg

    Terran:
        BotName: TerranRace
        Cycle:
            - Macro Zerg

    Protoss:
        BotName: ProtossRace
        Cycle:
            - Macro Zerg

    Zerg:
        BotName: ZergRace
        Cycle:
            - Macro Zerg

    Random:
        BotName: RandomRace
        Cycle:
            - Macro Zerg

Builds:
    # Empty on purpose: Macro Zerg no longer uses the BuildOrderRunner's
    # OpeningBuildOrder DSL at all - `ConstantWorkerProductionTill` racing
    # the opening's own steps for minerals (see git history on this file)
    # was a repeated source of subtle timing bugs. `OpeningBuildOrder` must
    # still be present (ares reads the key unconditionally), but an empty
    # list makes `build_order_runner.build_completed` true from frame 0, so
    # `bot.builds.zerg.macro_zerg` owns every timing itself, in Python,
    # from the very first frame - see that module for the actual opening.
    Macro Zerg:
        OpeningBuildOrder: []
