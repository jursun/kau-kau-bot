# KauKauBot openings, run by the ares BuildOrderRunner.
#
# Openings are deliberately short: they cover the parts of the game where
# exact timings matter, then hand off to `bot/core/macro_engine.py` /
# `BuildDefinition.macro_steps` once `build_order_runner.build_completed` is True.
#
# Forcing an opening locally: set `Debug: True` in config.yml (ares then uses
# the `test_123` opponent id) and put the opening you want first in the
# `test_123` cycle below. This replaces the old `FORCE_BUILD` in config.py.

# Save game opening + result to ./data so ares can switch openings after a loss.
UseData: True
# Cycle: keep the opening while it wins, advance to the next one after a defeat.
BuildSelection: Cycle
MinGamesWinrateBased: 5

BuildChoices:
    # Active when `Debug: True` in config.yml — reorder to force an opening.
    test_123:
        BotName: LocalDebug
        Cycle:
            - Macro Zerg

    Terran:
        BotName: TerranRace
        Cycle:
            - Macro Zerg

    Protoss:
        BotName: ProtossRace
        Cycle:
            - Macro Zerg

    Zerg:
        BotName: ZergRace
        Cycle:
            - Macro Zerg

    Random:
        BotName: RandomRace
        Cycle:
            - Macro Zerg

Builds:
    # 15 Hatch / 17 Pool into Roach -> Swarm Host (Corruptor if the enemy
    # shows air). Queens, third hatch and the Roach/Lair/Infestation Pit/
    # Spire tech tree are all handled dynamically after this opening finishes.
    Macro Zerg:
        # Held at 13 (one drone above where we start) rather than the
        # build's real economy target: `_produce_workers` runs every frame
        # regardless of which OpeningBuildOrder step is current, competing
        # with the opening's own steps for the same mineral bank. The
        # intended sequence is "first ~50 minerals -> the 13th drone (from
        # a larva), next ~100 minerals -> the 2nd Overlord (from a
        # different larva)" - at the real target (36), a THIRD drone kept
        # winning the race for that second block too (a drone only needs
        # 50 to the Overlord's 100), delaying the Overlord ~1-2s waiting
        # for the bank to refill after that extra drone purchase. Held at
        # 13, `_produce_workers` trains exactly the one drone this opening
        # wants anyway and then stops once that drone is pending or done
        # (ares counts supply_workers + already_pending against the till —
        # food_workers alone excludes eggs). That leaves the Overlord's
        # own step sole claim on the next block of minerals.
        # bot.builds.zerg.macro_zerg's on_step hook bumps this back up to
        # the real target the instant the 2nd Overlord is confirmed queued.
        ConstantWorkerProductionTill: 13
        AutoSupplyAtSupply: 19
        OpeningBuildOrder:
            - 13 overlord
            - 16 expand
            - 18 gas
            - 17 spawningpool
            - 19 overlord
            - 19 queen *2
            - 19 zergling *4
            - 25 expand
            - 24 overlord
            - 30 queen
            - 30 zerglingmovementspeed
            - 33 overlord
            - 36 overlord
