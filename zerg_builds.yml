# KauKauBot openings, run by the ares BuildOrderRunner.
#
# Openings are deliberately short: they cover the parts of the game where
# exact timings matter, then hand off to `bot/core/macro_engine.py` /
# `BuildDefinition.macro_steps` once `build_order_runner.build_completed` is True.
#
# Forcing an opening locally: set `Debug: True` in config.yml (ares then uses
# the `test_123` opponent id) and put the opening you want first in the
# `test_123` cycle below. This replaces the old `FORCE_BUILD` in config.py.

# Save game opening + result to ./data so ares can switch openings after a loss.
UseData: True
# Cycle: keep the opening while it wins, advance to the next one after a defeat.
BuildSelection: Cycle
MinGamesWinrateBased: 5

BuildChoices:
    # Active when `Debug: True` in config.yml — reorder to force an opening.
    test_123:
        BotName: LocalDebug
        Cycle:
            - Macro Zerg

    Terran:
        BotName: TerranRace
        Cycle:
            - Macro Zerg

    Protoss:
        BotName: ProtossRace
        Cycle:
            - Macro Zerg

    Zerg:
        BotName: ZergRace
        Cycle:
            - Macro Zerg

    Random:
        BotName: RandomRace
        Cycle:
            - Macro Zerg

Builds:
    # 15 Hatch / 17 Pool into Roach -> Swarm Host (Corruptor if the enemy
    # shows air). Queens, third hatch and the Roach/Lair/Infestation Pit/
    # Spire tech tree are all handled dynamically after this opening finishes.
    Macro Zerg:
        # Held at 12 (i.e. off - we already start with 12) rather than the
        # build's real economy target: `_produce_workers` runs every frame
        # regardless of which OpeningBuildOrder step is current, and at the
        # real target it was racing the very first step for the same
        # minerals - a drone only needs 50 to the Overlord's 100, so it
        # reliably won every contested bank, delaying the Overlord ~1-2s
        # waiting for the bank to refill after a drone purchase.
        # bot.builds.zerg.macro_zerg's on_step hook bumps this back up to
        # the real target the instant the 2nd Overlord is confirmed queued,
        # so it only holds for the ~6-8s that Overlord actually needs.
        #
        # The Overlord step itself is declared "12", not "13": at 13 it
        # would need supply_used >= 13 to even become eligible, which
        # itself requires training a 13th drone first - defeating the
        # whole point of holding drone production off, since that
        # prerequisite drone is exactly the same competing purchase this
        # is trying to avoid. Declaring it at 12 (supply is already 12 at
        # game start) means it's eligible from frame 0, with the held-off
        # `ConstantWorkerProductionTill` guaranteeing nothing else is
        # competing for the bank while it climbs to 100.
        ConstantWorkerProductionTill: 12
        AutoSupplyAtSupply: 19
        OpeningBuildOrder:
            - 12 overlord
            - 16 expand
            - 18 gas
            - 17 spawningpool
            - 19 overlord
            - 19 queen *2
            - 19 zergling *4
            - 27 expand
            - 26 overlord
            - 30 queen
            - 30 zerglingmovementspeed
            - 33 overlord
            - 36 overlord
