[tool.poetry]
name = "kau-kau-bot"
version = "0.2.0"
description = "Zerg StarCraft II bot for AI Arena, built on ares-sc2"
authors = ["Jason <jasonwong@eworldes.com>"]
readme = "README.md"
packages = [{include = "ares-sc2/src/ares"}]

[tool.poetry.dependencies]
ares-sc2 = { path = "ares-sc2", develop = false }
python = ">=3.11, <3.13"
black = "^23.1.0"
isort = "^5.12.0"
requests = "^2.32.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
extend-exclude = 'ares-sc2/*'

[tool.isort]
profile = "black"
skip_glob = ["ares-sc2/*"]
